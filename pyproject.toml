[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "birthday-agent-mvp"
version = "0.1.0"
description = "A small, safe-by-default birthday message agent MVP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
]

[project.scripts]
birthday-agent = "birthday_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

